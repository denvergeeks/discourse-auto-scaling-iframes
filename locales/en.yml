en:
  theme_metadata:
    description: "Adds an optional autoscaled desktop-style iframe mode for cooked post iframes using an {autoscale} marker."
    settings:
      desktop_width: "Virtual desktop width used as the iframe's unscaled layout width before autoscaling."
      aspect_ratio_width: "Visible autoscaled iframe viewport aspect-ratio width."
      aspect_ratio_height: "Visible autoscaled iframe viewport aspect-ratio height."
      iframe_border: "Border painted as an overlay on the autoscaled iframe wrapper."
